# ============================================================================
# Конфигурация бота поиска земельных участков для ИЖС (Хабаровский край)
#
# ВСЕ критерии поиска меняются ТОЛЬКО в этом файле — правка кода не требуется.
# После изменения значений просто запустите бота заново: python main.py
# ============================================================================

# --- Общие критерии отбора (раздел 6 ТЗ) -------------------------------------

# Регион поиска. Дополнительно задаётся кодом субъекта в ГИС «Торги»:
# dynSubjRF=31 — это Хабаровский край во внутреннем справочнике ГИС «Торги».
region: "Хабаровский край"
region_code: "31"
# Код субъекта, приходящий в ответе API (subjectRFCode): 27 — Хабаровский край.
region_subject_codes:
  - "27"
  - "31"

# Тип сделки: аренда земельного участка (typeTransaction=rent в ГИС «Торги»)
deal_type: "аренда"
type_transaction_code: "rent"

# Статус лота: опубликован / идёт приём заявок
status: "приём заявок"
lot_statuses:
  - "PUBLISHED"                # Опубликован
  - "APPLICATIONS_SUBMISSION"  # Приём заявок

# --- Пороговые значения -------------------------------------------------------

min_area_m2: 600                # Минимальная площадь, м² (0,06 га)
max_rent_per_year: 180000       # Максимальная арендная плата, руб./год
max_rent_per_month: 15000       # Максимальная арендная плата, руб./мес.
max_distance_km: 50             # Максимальное расстояние от центра Хабаровска, км

# Центр Хабаровска (для расчёта расстояния по формуле гаверсинусов)
center:
  lat: 48.4814
  lon: 135.0721

# --- Вид разрешённого использования (ИЖС) -------------------------------------

# Лот проходит, если хотя бы одно ключевое слово встречается в ВРИ или описании
vri_keywords:
  - "индивидуальное жилищное строительство"
  - "ижс"

# --- Местоположение (этап 1 — поиск по тексту) ---------------------------------

# Перечень можно свободно пополнять: название населённого пункта или района.
# Совпадение ищется в названии, адресе и описании лота.
location_keywords:
  - "Хабаровск"
  - "Хабаровский район"
  - "Хабаровский муниципальный район"
  - "Корфовский"
  - "Восточный"
  - "Индустриальный"
  - "Красная Речка"
  - "Чёрная Речка"
  - "Тополево"
  - "Малышево"
  - "Некрасовка"
  - "Ильинка"
  - "Заозёрное"
  - "Восточное"
  - "Рощино"
  - "Хехцир"
  - "Дога"
  - "Сикачи-Алян"
  - "Таёжный"
  - "Благодатное"
  - "Осиновая Река"

# --- Проверка рисков (раздел 7.3 ТЗ) ------------------------------------------

# Критические формулировки — лот ИСКЛЮЧАЕТСЯ (лист «Отклонённые»)
hard_reject_keywords:
  - "арест"
  - "залог"
  - "изъятие для государственных нужд"
  - "изъятие для государственных или муниципальных нужд"
  - "изъятие для муниципальных нужд"
  - "судебный спор"
  - "спор о праве"
  - "участок не сформирован"
  - "не сформирован"

# Потенциальные ограничения — лот переносится на лист «Требуют проверки».
# Слово «ограничение» само по себе НЕ включено: оно встречается в стандартных
# юридических формулировках и не является основанием для исключения.
review_keywords:
  - "сервитут"
  - "охранная зона"
  - "водоохранная зона"
  - "прибрежная защитная полоса"
  - "приаэродромная территория"
  - "красные линии"
  - "красная линия"
  - "зона затопления"
  - "санитарно-защитная зона"
  - "особые условия использования территории"
  - "зоуит"
  - "градостроительный регламент"

# Упоминания, говорящие ОБ ОТСУТСТВИИ проблемы (отрицания). Если найденная
# формулировка стоит рядом с таким отрицанием, она не считается риском.
negation_keywords:
  - "не наложен"
  - "не наложены"
  - "не установлено"
  - "не установлены"
  - "не выявлено"
  - "не выявлены"
  - "не обнаружено"
  - "не зарегистрировано"
  - "не зарегистрированы"
  - "отсутствует"
  - "отсутствуют"
  - "отсутствие"
  - "не имеются"

# Признаки подъезда и коммуникаций. Если в карточке лота не найдено ни одного
# упоминания из обоих списков, лот попадает на лист «Требуют проверки»
# (причина: нет сведений о подъезде/коммуникациях).
access_keywords:
  - "подъезд"
  - "подъездные пути"
  - "дорога"
  - "проезд"
  - "трасса"
  - "асфальт"

utilities_keywords:
  - "электроснабжение"
  - "электричество"
  - "электроэнергия"
  - "водоснабжение"
  - "вода"
  - "водопровод"
  - "газ"
  - "коммуникации"
  - "технические условия"
  - "ту"

# --- Вывод результатов (раздел 10.3 ТЗ) ----------------------------------------

output:
  excel_file: "output/land_lots_report.xlsx"   # основной файл отчёта
  log_file: "search.log"                       # журнал работы
  dated_copy: true                             # дополнительно сохранять копию
                                               # вида land_lots_report_2026-11-18.xlsx
  download_documents: false                    # true — скачивать PDF-документы лотов
                                               # и анализировать их текст на риски
  max_documents_per_lot: 5                     # сколько документов анализировать на лот
  max_document_size_mb: 10                     # предельный размер одного документа

# --- Сетевые параметры (раздел 11.3 ТЗ) ----------------------------------------

request:
  delay_min_seconds: 2        # пауза между запросами (случайная величина)
  delay_max_seconds: 5
  retries: 3                  # повторов при сетевой ошибке
  timeout_seconds: 30         # таймаут одного запроса
  page_size: 50               # лотов на страницу выдачи API
  max_pages: 40               # защитный предел страниц (не бесконечная пагинация)

user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 torgi-land-bot/1.0"

# --- Геокодирование (этап 2 определения местоположения) ------------------------

geocoding:
  enabled: true
  # 1) координаты из карточки лота (поле point в API ГИС «Торги»);
  # 2) НСПД (nspd.gov.ru) по кадастровому номеру;
  # 3) Nominatim (OpenStreetMap) по адресу — 1 запрос в секунду.
  use_nspd: true
  use_nominatim: true
  nominatim_user_agent: "torgi-land-bot/1.0 (поиск участков ИЖС, Хабаровский край)"
  nominatim_delay_seconds: 1.1

# --- Источники данных (раздел 5 ТЗ) --------------------------------------------

sources:
  primary: "torgi"          # основной источник: ГИС «Торги»
  reserve:                  # резервные источники, используются по очереди
    - "goszemli"
  reserve_max_details: 40   # максимум карточек резервного источника за запуск

# --- Журналирование -------------------------------------------------------------

logging:
  level: "INFO"             # DEBUG | INFO | WARNING | ERROR
